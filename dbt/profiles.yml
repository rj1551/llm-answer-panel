# Committed on purpose: it holds no secrets, only env_var() lookups.
# Run dbt through `make` (or `dotenv run -- dbt ...`) so .env is loaded.
llm_answer_panel:
  target: dev
  outputs:
    dev:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'localhost') }}"
      port: "{{ env_var('CLICKHOUSE_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_USER', 'panel') }}"
      password: "{{ env_var('CLICKHOUSE_PASSWORD', 'panel_local') }}"
      # dbt-clickhouse treats "schema" as the ClickHouse database for models.
      schema: analytics
      secure: false
      threads: 4
